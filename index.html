<!DOCTYPE html>
<html lang="pt-BR">

<head>
    
    <meta charset="UTF-8">

    <!-- Faz o site se adaptar corretamente a dispositivos diversos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RPT Interno - TESTE</title>

    <!-- Importa o arquivo CSS  -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ========================================================= CABEÇALHO DO SITE ========================================================= -->

<header>

    <div class="logo">

        <img
            src="logo.png"
            alt="Brasão 18º GB"
        >

    </div>


    
    <div class="titulo">

        <h1>RPT INTERNO</h1>

        <h3>18º Grupamento de Bombeiros</h3>

        <!--
            Exibe a data da última atualização.

            O texto "Carregando..." é exibido inicialmente.
            O JavaScript substitui esse conteúdo pela data
            quando os dados são carregados.
        -->
        <p>
            Última atualização:
            <strong id="data-atualizacao">Carregando...</strong>
        </p>

    </div>

</header>


<!-- ========================================================= TABELAS COM AS INSCRIÇÕES DO FORMS ========================================================= -->

<div class="container">

    <div id="resultado">

        <p class="carregando">
            Carregando inscrições...
        </p>

    </div>

</div>


<section class="inscricao">

    <h3>Link para inscrição no RPT Interno</h3>

    <!-- Orientações para os militares -->
    <p>
        As inscrições deverão ser realizadas exclusivamente pelo formulário eletrônico abaixo:
    </p>

    <!-- Link para o forms -->
    <a href="https://forms.gle/B3ThCNmUgX8FnGm97" target="_blank">
        Formulário de inscrição
    </a>

</section>


<!-- ========================================================= RODAPÉ ========================================================= -->

<footer>

    Documento meramente informativo.

</footer>


<!-- ========================================================= JAVASCRIPT ========================================================= -->

<script src="script.js"></script>

</html>
